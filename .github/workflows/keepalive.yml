# Не даёт бесплатному серверу ScorpiLibria на Render засыпать: после 15 минут
# без запросов он «засыпает», и первый посетитель ждёт его пробуждения 30–60 с
# (не работают вход, совместный просмотр и друзья).
# Живёт в этом публичном репозитории: здесь минуты GitHub Actions бесплатны.
# Исходник — apps/tizen/.github в основном репозитории ScorpiLibria.
name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://scorpilibria-api.onrender.com/api/health) || code=000
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::API не ответило 200"
